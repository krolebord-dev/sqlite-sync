packages:
  - packages/*
  - apps/*

# Pin a single `ai` version so ToolSet types unify across @sqlite-sync/ai, @cloudflare/think,
# and the apps (duplicate installs otherwise produce incompatible structural types).
overrides:
  ai: 6.0.214

catalog:
  '@sqlite.org/sqlite-wasm': 3.53.0-build1
  kysely: ^0.28.10
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: npm:@typescript/typescript6@6.0.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3

ignoredBuiltDependencies:
  - '@prisma/client'

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - lefthook
  - react-grab
  - sharp
  - workerd
